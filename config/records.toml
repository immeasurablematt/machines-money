# config/records.toml
# Human-editable configuration for DeFi20 dashboard data sources.
# Edit this file to add projects, fix slugs, or change sectors — no Python required.
# Loaded by scripts/refresh_dashboard_data.py at runtime via tomllib (Python 3.11+ stdlib).

# ── Main protocol records ──────────────────────────────────────────────────
# Required: project, record, sector, confidence, notes
# Optional: protocol_slug (DefiLlama TVL/history), fee_slug (DefiLlama fees/revenue),
#           dex_module (DefiLlama DEX overview)

