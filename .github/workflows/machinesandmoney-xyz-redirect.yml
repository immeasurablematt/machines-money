name: Deploy machinesandmoney.xyz Redirect

on:
  push:
    branches: [main]
    paths:
      - "docs/domain-redirect/**"
      - ".github/workflows/machinesandmoney-xyz-redirect.yml"
  workflow_dispatch: {}

concurrency:
  group: machinesandmoney-xyz-redirect
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create machinesandmoney-xyz --production-branch=main

      - name: Deploy redirect to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/domain-redirect --project-name=machinesandmoney-xyz --commit-dirty=true
