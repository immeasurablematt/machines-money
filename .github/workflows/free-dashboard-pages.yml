name: Deploy Free Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/dashboard/free.html"
      - "docs/dashboard/welcome.html"
      - "docs/dashboard/generated-dashboard-data.js"
      - "scripts/build_free_dashboard_bundle.sh"
      - ".github/workflows/free-dashboard-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: free-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build free dashboard static bundle
        run: bash scripts/build_free_dashboard_bundle.sh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
