name: Refresh Free Dashboard Data

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/free-dashboard-refresh.yml"
      - "scripts/refresh_dashboard_data.py"
      - "config/records.toml"
      - "docs/dashboard/starter-token-map.csv"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: free-dashboard-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore data from data branch
        run: |
          git fetch origin data
          git archive origin/data -- docs/dashboard/generated-dashboard-data.csv docs/dashboard/generated-dashboard-data.js docs/dashboard/snapshots docs/dashboard/last-good 2>/dev/null | tar -x || true

      - name: Refresh dashboard data
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DASHBOARD_MIN_ROWS: "40"
          DASHBOARD_MIN_LAST_GOOD_RATIO: "0.5"
        run: python3 scripts/refresh_dashboard_data.py

      - name: Prune old snapshots (keep 7 days)
        run: |
          SNAP_DIR="docs/dashboard/snapshots"
          if [ -d "$SNAP_DIR" ]; then
            ls "$SNAP_DIR" | sort -r | tail -n +32 | xargs -r -I{} rm -rf "$SNAP_DIR/{}"
          fi

      - name: Push refreshed data to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git worktree add --detach /tmp/data-branch origin/data
          mkdir -p /tmp/data-branch/docs/dashboard/snapshots /tmp/data-branch/docs/dashboard/last-good
          cp docs/dashboard/generated-dashboard-data.csv /tmp/data-branch/docs/dashboard/ 2>/dev/null || true
          cp docs/dashboard/generated-dashboard-data.js /tmp/data-branch/docs/dashboard/ 2>/dev/null || true
          [ -d docs/dashboard/snapshots ] && rsync -a --delete docs/dashboard/snapshots/ /tmp/data-branch/docs/dashboard/snapshots/ || true
          [ -d docs/dashboard/last-good ] && rsync -a --delete docs/dashboard/last-good/ /tmp/data-branch/docs/dashboard/last-good/ || true
          cd /tmp/data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes to push."
          else
            git commit -m "Refresh free dashboard data"
            git push origin HEAD:refs/heads/data
          fi

      - name: Build free dashboard static bundle
        run: bash scripts/build_free_dashboard_bundle.sh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
